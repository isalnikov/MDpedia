# Schema для валидации фронтматтера MDpedia

concept:
  required:
    - title
    - skill
    - level
  properties:
    title:
      type: string
      min_length: 1
    skill:
      type: array
      items:
        type: string
      min_items: 1
    level:
      type: string
      enum: [beginner, intermediate, advanced]
    prerequisites:
      type: array
      items:
        type: string
    embeddings:
      type: object
      properties:
        chunk_strategy:
          type: string
          enum: [semantic-paragraphs, headings, fixed-size]
        max_tokens:
          type: integer
          minimum: 64
          maximum: 8192
    relations:
      type: object
      properties:
        requires:
          type: array
          items:
            type: string
        parent:
          type: string
        contradicts:
          type: array
          items:
            type: string

skill:
  required:
    - name
    - version
    - inputs
    - outputs
  properties:
    name:
      type: string
      min_length: 1
    version:
      type: string
      pattern: "^\\d+\\.\\d+"
    inputs:
      type: array
      items:
        type: string
    outputs:
      type: array
      items:
        type: string
    tags:
      type: array
      items:
        type: string
